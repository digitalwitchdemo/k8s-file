apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-app

commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"

resources:
  - flagd.yaml
  # Shop services
  - ad.yaml
  - cart.yaml
  - checkout.yaml
  - currency.yaml
  - email.yaml
  - payment.yaml
  - product-catalog.yaml
  - quote.yaml
  - recommendation.yaml
  - shipping.yaml
  - accounting.yaml
  - fraud-detection.yaml
  - image-provider.yaml
  - frontend.yaml
  - frontend-proxy.yaml
  - telemetry-docs.yaml
  - load-generator.yaml
  # AI assistant
  - chatbot.yaml
  - agent.yaml
  - mcp.yaml

configMapGenerator:
  - name: app-env
    envs:
      - config/app.env
  - name: product-catalog-otel-config
    files:
      - config/otel-config.yml
  - name: flagd-default-flags
    files:
      - config/demo.flagd.json
  - name: agent-vcr-cassettes
    files:
      - config/vcr_cassettes/azure_gpt-5.5_cassette.yaml
      - config/vcr_cassettes/claude-opus-4-7_cassette.yaml

# Image tags - updated automatically by the ecommerce-final-project pipeline
images:
  - name: 060647991200.dkr.ecr.us-west-1.amazonaws.com/ecomerce/accounting
    newTag: "9"
