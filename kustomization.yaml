# Astronomy Shop on EKS - everything Argo CD syncs from Git.
#
#   00-base            namespaces, gp3 StorageClass, mergeable ClusterIssuer
#   10-ecommerce-data  PostgreSQL, Valkey, Kafka                 (wave 1)
#   20-logging         OpenSearch, OpenSearch Dashboards         (wave 2)
#   30-observability   Collector, OpAMP, Jaeger, Prometheus, Grafana (wave 3)
#   40-ecommerce-app   flagd, flagd-ui, 17 shop services, AI assistant (wave 4)
#
# 50-ingress is deliberately NOT listed: apply it by hand once DNS resolves
# (see 50-ingress/kustomization.yaml). Secrets come from create-secrets.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-base
  - 10-ecommerce-data
  - 20-logging
  - 30-observability
  - 40-ecommerce-app

# Image tags for every image built by .github/workflows/ecr-build-push.yml.
# Pin newTag to a commit SHA tag (e.g. "c5f9da36") for repeatable deploys.
images:
