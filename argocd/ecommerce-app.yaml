# Argo CD Application: keeps the cluster in sync with this folder in Git.
# Apply once:  kubectl apply -f argocd/ecommerce-app.yaml
#
# The repository is private, so first give Argo CD read access
# (Argo CD UI -> Settings -> Repositories -> Connect repo, using a GitHub
# fine-grained token with read-only "Contents" permission).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astronomy-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/digitalwitchdemo/k8s-file.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Large Grafana dashboard ConfigMaps exceed the client-side apply limit
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
